; Friend Radar — EWatch addon (BaseOS + the Friend Radar app).
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                 -> firmware (env:ewatch, the default)
;   pio test -e native      -> host unit tests for the radar algorithms

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA): WiFi + NimBLE together exceed the default
; 1.25 MB app slot.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/assets/fonts
    -Isrc/apps/radar
    -Isrc/apps/radar/logic
    -Isrc/apps/radar/gfx
;   ---- feature gates ----
;   Flip a gate to 0 to compile the feature out entirely; the linker then drops
;   the underlying libraries so the firmware shrinks materially. The WiFi gate
;   drops WiFi/WebServer/DNSServer (src/core/wifi_svc.*) and its settings pages.
    -DEWATCH_ENABLE_WIFI=1
;   Friend Radar background "mate alerts" (stretch goal). 1 compiles in the
;   duty-cycled deep-sleep scanner; it still has to be switched on in the app
;   (Radar menu -> Background alerts, default off). Set 0 to remove it
;   entirely if hardware testing finds problems: the watch then behaves like
;   stock BaseOS whenever the radar app is closed.
    -DFR_BACKGROUND_ALERTS=1
;   ---- NimBLE (observer + broadcaster only: no connections, no GATT) ----
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git
    h2zero/NimBLE-Arduino @ 1.4.3

; ---------------------------------------------------------------------------
; Host unit tests (Unity). Compiles only the Arduino-free radar logic and the
; software renderer, so the algorithms can be tested on the build machine.
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform         = native
test_framework   = unity
test_build_src   = yes
build_src_filter =
    -<*>
    +<apps/radar/logic/>
    +<apps/radar/gfx/>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc/apps/radar/logic
    -Isrc/apps/radar/gfx
