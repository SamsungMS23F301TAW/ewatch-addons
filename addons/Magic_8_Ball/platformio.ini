; Shake Oracle for EWatch: EWatch BaseOS @ dbe73c2 plus one app.
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                 build the firmware (env:ewatch)
;   pio test -e native      host unit tests (shake detector, text fit, answers, scene)

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA) — RF Diag pulls in WiFi+bluedroid BLE which
; together exceed the default 1.25 MB app slot.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/assets/fonts
    -Isrc/apps/oracle/core
;   ---- feature gates ----
;   Flip a gate to 0 to compile the feature out entirely; the linker then drops
;   the underlying libraries so the firmware shrinks materially. The WiFi gate
;   drops WiFi/WebServer/DNSServer (src/core/wifi_svc.*) and its settings pages.
;   Shake Oracle needs no networking, so WiFi is compiled out. Saved WiFi
;   networks stay in NVS untouched for the next addon that uses them.
    -DEWATCH_ENABLE_WIFI=0
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

; Core deps only — the display + touch drivers.
lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git

; ---------------------------------------------------------------------------
; Host unit tests for the portable core in src/apps/oracle/core (no Arduino).
; tools/host_include supplies gfxfont.h so the BaseOS font headers compile.
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform         = native
test_framework   = unity
test_build_src   = yes
build_src_filter = -<*> +<apps/oracle/core/>
build_flags =
    -std=gnu++17
    -O1
    -Wall
    -Wextra
    -DPROGMEM=
    -Itools/host_include
    -Isrc/apps/assets/fonts
    -Isrc/apps/oracle/core
