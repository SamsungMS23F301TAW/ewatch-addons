; Meeting Countdown — EWatch addon (BaseOS + the meeting-countdown watch face).
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   ~/.platformio/penv/bin/pio run                 # firmware (env:ewatch)
;   ~/.platformio/penv/bin/pio test -e native      # host unit tests
;   sh tools/preview/render.sh                     # host-rendered face previews

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA).
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/meeting
    -Isrc/apps/assets/fonts
;   ---- feature gates ----
;   WiFi: drops WiFi/WebServer/DNSServer and everything that syncs a feed.
    -DEWATCH_ENABLE_WIFI=1
;   Meeting Countdown power features (see README "Power strategy"):
;   MC_HEADLESS_WAKE  timer wakes that are not an alert (drift-correcting
;                     pre-wakes, background syncs) run with the screen off and
;                     go straight back to sleep. 0 = every timer wake boots the
;                     normal UI for a few seconds (still correct, more visible).
;   MC_BACKGROUND_SYNC periodic feed sync from deep sleep (needs HEADLESS_WAKE).
;                     0 = feeds sync only on demand while the watch is awake.
;   MC_TLS_VERIFY     verify HTTPS certificates against the Mozilla root bundle
;                     built into the ESP-IDF SDK (recommended).
;   MC_SLEEP_TRIM     before deep sleep: panel SLPIN, backlight 0, accelerometer
;                     standby when it is not a wake source.
    -DMC_HEADLESS_WAKE=1
    -DMC_BACKGROUND_SYNC=1
    -DMC_TLS_VERIFY=1
    -DMC_SLEEP_TRIM=1
;   ---- size / dead-code ----
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git

; ---------------------------------------------------------------------------
; Host unit tests (Unity) for the pure-C++ core in lib/meetcore: the streaming
; ICS parser, RRULE/VTIMEZONE handling, HTTP framing, the alert/wake planner
; and the face renderer. Fixtures live in test/fixtures.
;   ~/.platformio/penv/bin/pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform        = native
test_framework  = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Itools/hostinc
    -Isrc/apps/assets/fonts
    -DMC_FIXTURE_DIR=\"$PROJECT_DIR/test/fixtures\"
lib_ignore = AXP2101
