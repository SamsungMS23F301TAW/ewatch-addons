<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Meeting Countdown: a ring draining toward the next calendar event. -->
  <rect width="128" height="128" rx="28" fill="#0E1318"/>
  <!-- track -->
  <path d="M64 14H86A26 26 0 0 1 112 40V88A26 26 0 0 1 86 114H42A26 26 0 0 1 16 88V40A26 26 0 0 1 42 14Z"
        fill="none" stroke="#24303B" stroke-width="10"/>
  <!-- remaining time: drawn anticlockwise from 12 o'clock, 65% of the track -->
  <path d="M64 14H42A26 26 0 0 0 16 40V88A26 26 0 0 0 42 114H86A26 26 0 0 0 112 88V40A26 26 0 0 0 86 14Z"
        fill="none" stroke="#2CD9A8" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="226 400"/>
  <!-- the ring's leading edge -->
  <circle cx="109.9" cy="98.2" r="7.5" fill="#2CD9A8"/>
  <circle cx="109.9" cy="98.2" r="3.4" fill="#D9FFF3"/>
  <!-- calendar page -->
  <rect x="40" y="42" width="48" height="46" rx="8" fill="#F2F4F7"/>
  <path d="M40 50a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v6H40z" fill="#2CD9A8"/>
  <rect x="50" y="36" width="5" height="12" rx="2.5" fill="#F2F4F7"/>
  <rect x="73" y="36" width="5" height="12" rx="2.5" fill="#F2F4F7"/>
  <rect x="48" y="64" width="32" height="8" rx="4" fill="#FFB224"/>
  <rect x="48" y="76" width="20" height="5" rx="2.5" fill="#B9C2CC"/>
</svg>
