; Pixel Pet — EWatch addon (BaseOS @ dbe73c2 + a walk-fed pixel pet).
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                 firmware (env:ewatch is the default env)
;   pio test -e native      host unit tests (step detector, day book, pet model)

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA). Keeps the same partition table as every other
; EWatch addon so the NVS region (user settings) survives an addon swap.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/pet
    -Isrc/apps/assets/fonts
;   ---- feature gates ----
;   WiFi is compiled out: the pet needs no network, and a live radio cannot
;   coexist with the light-sleep step sampler. Set the clock in Settings.
    -DEWATCH_ENABLE_WIFI=0
;   ---- Pixel Pet gates (see README "Power strategy") ----
;   PIXELPET_BG_STEPS   1 = screen-off is light sleep with FIFO step sampling,
;                           deep sleep only after long stillness, no idle
;                           power-off. 0 = stock BaseOS power behaviour
;                           (deep sleep, auto power-off); steps count only
;                           while the screen is on.
;   PIXELPET_DEEP_TIER  1 = after PIXELPET_STILL_MIN minutes without motion,
;                           drop from light sleep to deep sleep with an
;                           accelerometer motion wake. 0 = stay in light sleep.
;   PIXELPET_PANEL_SLPIN 1 = put the ST7789 into SLPIN while dark (lowest
;                           current). 0 = DISPOFF only (faster wake).
;   PIXELPET_LOWBAT_CUTOFF 1 = power off after sustained, plausible readings
;                           below 3.40 V.
;   PIXELPET_CONSOLE    1 = tiny serial command console in loop().
    -DPIXELPET_BG_STEPS=1
    -DPIXELPET_DEEP_TIER=1
    -DPIXELPET_STILL_MIN=12
    -DPIXELPET_PANEL_SLPIN=1
    -DPIXELPET_LOWBAT_CUTOFF=1
    -DPIXELPET_CONSOLE=1
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

; Core deps only — the display + touch drivers.
lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git

; ---------------------------------------------------------------------------
; Host unit tests (Unity). Only the Arduino-free cores are compiled: the
; step detector + day book, the pet model, and the pixel renderer/art/scenes.
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Isrc/core
    -Isrc/apps/pet
    -Wall
    -Wextra
build_src_filter =
    -<*>
    +<core/steps.cpp>
    +<apps/pet/petmodel.cpp>
    +<apps/pet/px.cpp>
    +<apps/pet/petart.cpp>
    +<apps/pet/scenes.cpp>
test_build_src = yes
