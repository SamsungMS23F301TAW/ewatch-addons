; EWatch v2 firmware — PlatformIO project (Tilt Parallax addon).
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                    firmware (env:ewatch, the default)
;   pio test -e native         host unit tests (tilt filter, compositor, scenes)

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA) — RF Diag pulls in WiFi+bluedroid BLE which
; together exceed the default 1.25 MB app slot.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/assets/fonts
    -Isrc/apps/parallax
    -Isrc/apps/parallax/engine
;   ---- feature gates ----
;   Flip a gate to 0 to compile the feature out entirely; the linker then drops
;   the underlying libraries so the firmware shrinks materially. The WiFi gate
;   drops WiFi/WebServer/DNSServer (src/core/wifi_svc.*) and its settings pages.
;   Add your own gate for an optional app the same way: wrap the app's sources
;   and its view.cpp registration in `#if defined(...) && ...`.
    -DEWATCH_ENABLE_WIFI=1
;   Tilt Parallax: log fps / compose / push timings to serial every 2 s while
;   the scene is moving (rate-limited; silent when still). 0 to compile out.
    -DTP_PERF_LOG=1
;   Tilt Parallax options (both default 0, see README):
;     -DTP_COMPOSE_TO_CANVAS=1   compose into frameCanvas() instead of an SRAM strip
;     -DTP_RAISE_TO_WAKE=1       experimental raise-to-wake on MMA8451 INT2
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

; Core deps only — the display + touch drivers. Add an app's own libraries
; here when you build one (e.g. ricmoo/QRCode for a QR app).
lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git

; Note: upstream BaseOS also declares a `disptest` env for
; src/test/disp_touch_test.cpp, but that file isn't in the BaseOS slate, so
; the env could never build. It's omitted here.

; ---------------------------------------------------------------------------
; Host unit tests for the pure-C++ engine (src/apps/parallax/engine): tilt
; filter, span compositor, scenes, sky. No Arduino code is compiled.
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++11
    -O1
    -Isrc/apps/parallax/engine
    -Itools/host_shim
    -Isrc/apps/assets/fonts
build_src_filter =
    -<*>
    +<apps/parallax/engine/>
