; Dayprint (generative-face) — an EWatch addon built on BaseOS @ dbe73c2.
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                 build the firmware (env:ewatch, the default)
;   pio test -e native      host unit tests (art determinism, step detector,
;                           day records) — no watch needed

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA). The 896 KB "spiffs" data partition holds the
; day-record collection (LittleFS, /generative-face/days.bin).
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
board_build.filesystem  = littlefs

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/assets/fonts
    -Isrc/art
;   ---- feature gates ----
;   Flip a gate to 0 to compile the feature out entirely. This addon has no
;   networking, so WiFi/WebServer/DNSServer (src/core/wifi_svc.*) and their
;   settings pages are compiled out. (Saved WiFi networks in NVS are untouched
;   and come back if another addon re-enables WiFi.)
    -DEWATCH_ENABLE_WIFI=0
;   ---- Dayprint gates ----
;   GF_BG_STEPS=1   screen-off is LIGHT sleep with the accelerometer FIFO
;                   waking the CPU about every 0.6 s so steps keep counting;
;                   long stillness drops to deep sleep with motion wake.
;   GF_BG_STEPS=0   stock BaseOS power behaviour (deep sleep after the idle
;                   timeout, auto power-off) and steps count only while the
;                   screen is on. The safe fallback if hardware testing finds
;                   a light-sleep problem.
    -DGF_BG_STEPS=1
;   Low-battery cutoff for background mode, in millivolts (0 disables). Needs
;   three consecutive plausible readings below the threshold.
    -DGF_LOWBAT_CUTOFF_MV=3350
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

; Core deps only — the display + touch drivers.
lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git

; ---------------------------------------------------------------------------
; Host unit tests. Builds only the Arduino-free cores (the art generator, the
; face compositor, the step detector and the day-record codec) with the host
; compiler and runs the Unity suites under test/.
; ---------------------------------------------------------------------------
[env:native]
platform        = native
test_framework  = unity
test_build_src  = yes
build_src_filter =
    -<*>
    +<art/>
    +<core/steps.cpp>
    +<core/dayrec.cpp>
    +<core/sleep_policy.cpp>
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    -Isrc/art
    -Isrc/core
lib_ignore = AXP2101
