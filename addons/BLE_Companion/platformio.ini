; EWatch Companion — BaseOS + a Web Bluetooth config service.
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                 build the firmware (env:ewatch, the default)
;   pio test -e native      host unit tests (protocol codec + face slots)

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA) — RF Diag pulls in WiFi+bluedroid BLE which
; together exceed the default 1.25 MB app slot.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/face
    -Isrc/apps/assets/fonts
;   ---- feature gates ----
;   Flip a gate to 0 to compile the feature out entirely; the linker then drops
;   the underlying libraries so the firmware shrinks materially. The WiFi gate
;   drops WiFi/WebServer/DNSServer (src/core/wifi_svc.*) and its settings pages.
;   Add your own gate for an optional app the same way: wrap the app's sources
;   and its view.cpp registration in `#if defined(...) && ...`.
    -DEWATCH_ENABLE_WIFI=1
;   EWatch Companion: the BLE config service (src/core/ble_config.*) and the
;   Companion screen. 0 compiles BLE out entirely; the face slots still work
;   with whatever configuration is saved in NVS.
    -DEWATCH_ENABLE_BLE=1
;   Experimental: also require BLE link encryption ("Just Works" LE Secure
;   Connections, no bonding) on top of the 6-digit app code. Off by default
;   because OS pairing prompts are unreliable through Web Bluetooth; see
;   README "Security".
    -DEWATCH_BLE_REQUIRE_ENCRYPTION=0
;   ---- NimBLE trims (peripheral + advertiser only, one central at a time) ----
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=2
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=16
;   Our GATT callbacks run on the NimBLE host task; give it 1 KiB of headroom.
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=5120
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

; Core deps: the display + touch drivers, plus NimBLE for the config service.
lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git
    h2zero/NimBLE-Arduino @ 1.4.3

; ---------------------------------------------------------------------------
; Host unit tests: the wire-protocol codec and the face-slot formatter are
; plain C++11, compiled here with the host compiler and Unity. The same test
; vectors drive the JavaScript tests for web/index.html.
;   Run:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform         = native
test_framework   = unity
test_build_src   = yes
build_flags      = -std=c++11 -Wall -Wextra -Isrc/core
build_src_filter = -<*> +<core/ble_proto.cpp> +<core/face_slots.cpp>

; ---------------------------------------------------------------------------
; Standalone DISPLAY + TOUCH bring-up test. Inherits everything from
; [env:ewatch] but compiles ONLY src/test/disp_touch_test.cpp (its own
; setup()/loop()), so none of the normal app sources are linked in.
;   Run it:        pio run -e disptest -t upload -t monitor
;   Back to app:   pio run -e ewatch   -t upload -t monitor
; (Upstream BaseOS ships this env without the test source; kept for parity.)
; ---------------------------------------------------------------------------
[env:disptest]
extends = env:ewatch
build_src_filter =
    -<*>
    +<test/disp_touch_test.cpp>
