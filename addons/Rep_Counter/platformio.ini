; Rep Counter for EWatch: BaseOS + a gym rep counter app.
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; on this machine). LEDC therefore uses the channel-based API (ledcSetup/
; ledcAttachPin/ledcWrite-by-channel). GFX Library is pinned below 1.5.0
; because 1.5+ depends on v3-only headers (esp32-hal-periman.h).
;
;   pio run                      firmware (env:ewatch)
;   pio test -e native           host unit tests (detector, session, UI)

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA).
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/reps
    -Isrc/apps/assets/fonts
;   ---- feature gates ----
;   Flip a gate to 0 to compile the feature out entirely; the linker then drops
;   the underlying libraries so the firmware shrinks materially. The WiFi gate
;   drops WiFi/WebServer/DNSServer (src/core/wifi_svc.*) and its settings pages.
    -DEWATCH_ENABLE_WIFI=1
;   ---- Rep Counter gates ----
;   REPS_IMU_FIFO: while the app is open (or recording), run the MMA8451 at
;   100 Hz high-resolution with its FIFO for exact sample timing. 0 = leave the
;   chip exactly as BaseOS configures it and resample taskIO's ~45 Hz polls to
;   50 Hz instead (the fallback if the FIFO path misbehaves on hardware).
    -DREPS_IMU_FIFO=1
;   REPS_RANGE_4G: in FIFO mode use +/-4 g so fast curls don't clip. Values
;   handed to the rest of BaseOS (model.ax/ay/az) are rescaled to the usual
;   4096 counts/g either way.
    -DREPS_RANGE_4G=1
;   REPS_ENABLE_REC: serial console with `REC on` / `REC off` raw CSV streaming
;   for tuning (tools/record.py). Costs nothing unless a host sends commands.
    -DREPS_ENABLE_REC=1
;   ---- size / dead-code ----
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_src_filter =
    +<*>
    -<test/>

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git

; ---------------------------------------------------------------------------
; Host unit tests: the detector, session model and UI renderer are plain C++
; (no Arduino), so they build and run on the development machine.
;   ~/.platformio/penv/bin/pio test -d addons/Rep_Counter -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -O2
    -Isrc/apps/reps
    -Isrc/apps/assets/fonts
    -Itest/support
    -DREPS_HOST=1
build_src_filter =
    -<*>
    +<apps/reps/rep_detector.cpp>
    +<apps/reps/rep_session.cpp>
    +<apps/reps/rep_gfx.cpp>
    +<apps/reps/rep_ui.cpp>
